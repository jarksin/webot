<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="webot-runtime-revision" content="__WEBOT_RUNTIME_REVISION__">
  <title>Webot Console</title>
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <i data-lucide="message-square"></i>
        <div>
          <h1>Webot</h1>
          <span>Personal Assistant</span>
        </div>
      </div>
      <div class="header-actions">
        <label id="worker-control" class="switch-control" title="开启或暂停 Case Worker">
          <input id="worker-toggle" type="checkbox" data-action="workers-toggle">
          <span class="switch-track"><span class="switch-knob"></span></span>
          <span id="worker-label" class="switch-text">Workers</span>
        </label>
        <label class="header-toggle" title="生成 Draft 后是否自动回复微信">
          <input id="auto-reply-toggle" type="checkbox" data-action="auto-reply-toggle">
          <span id="auto-reply-label">Auto reply</span>
        </label>
        <div class="service-state">
          <span id="service-dot" class="status-dot"></span>
          <span id="service-label">正在连接</span>
          <code id="runtime-build">读取版本中</code>
        </div>
      </div>
    </header>
    <div class="toolbar app-toolbar">
      <nav aria-label="管理视图">
        <button class="nav-item active" data-view="cases"><i data-lucide="inbox"></i><span>Case</span></button>
        <button class="nav-item" data-view="captured"><i data-lucide="activity"></i><span>All Captured</span></button>
        <button class="nav-item" data-view="directory"><i data-lucide="contact-round"></i><span>ID 目录</span></button>
        <button class="nav-item" data-view="knowledge"><i data-lucide="book-open"></i><span>知识库</span></button>
        <button class="nav-item" data-view="settings"><i data-lucide="settings"></i><span>设置</span></button>
      </nav>
      <div class="view-context">
        <span id="view-eyebrow">CASES</span>
        <strong id="view-title">微信 Case</strong>
      </div>
      <div class="top-actions">
        <span class="save-state" id="save-state"></span>
        <button class="button secondary" id="refresh-button" title="刷新状态"><i data-lucide="refresh-cw"></i><span>刷新</span></button>
        <button class="button primary" id="save-button"><i data-lucide="save"></i><span>保存配置</span></button>
      </div>
    </div>
    <main>
      <div id="notice" class="notice hidden" role="status"></div>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>
  <script type="module" src="/assets/admin.js"></script>
</body>
</html>
